<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Ears Skin Editor -- test harness</title>
	<style>
		body { font: 13px/1.5 ui-monospace, Consolas, monospace; background: #16161a; color: #ddd; padding: 16px; }
		.pass { color: #6ec46e; } .fail { color: #ff6b6b; } .info { color: #8ab4f8; }
		pre { margin: 2px 0; white-space: pre-wrap; }
		h2 { color: #fff; font-size: 14px; margin: 16px 0 4px; border-bottom: 1px solid #333; }
	</style>
</head>
<body>
<h1 style="font-size:16px">Ears Skin Editor test harness</h1>
<div id="out"></div>

<!-- classic script: `var initCommon` lands on the global object, which is where
     bridge.js expects to find it -->
<script src="../vendor/ears-common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script type="module">
import * as Codec from '../src/codec.js';
import * as V0 from '../src/codec-v0.js';
import * as Bridge from '../src/bridge.js';
import { buildGeometry } from '../src/bedrock-geometry.js';
import * as SkinPack from '../src/skinpack.js';

const out = document.getElementById('out');
let passed = 0, failed = 0;

const log = (msg, cls = '') => {
	const pre = document.createElement('pre');
	pre.className = cls;
	pre.textContent = msg;
	out.appendChild(pre);
};
const section = (name) => { const h = document.createElement('h2'); h.textContent = name; out.appendChild(h); };
const check = (name, cond, detail = '') => {
	if (cond) { passed++; log(`  PASS  ${name}`, 'pass'); }
	else { failed++; log(`  FAIL  ${name}${detail ? '  --  ' + detail : ''}`, 'fail'); }
};
const eq = (name, actual, expected) =>
	check(name, JSON.stringify(actual) === JSON.stringify(expected), `got ${JSON.stringify(actual)}, want ${JSON.stringify(expected)}`);

function blankSkin() {
	const canvas = document.createElement('canvas');
	canvas.width = 64; canvas.height = 64;
	const ctx = canvas.getContext('2d', { willReadFrequently: true });
	// Opaque body pixels so Ears has something to render against.
	ctx.fillStyle = '#a06840';
	ctx.fillRect(0, 0, 64, 64);
	return ctx.getImageData(0, 0, 64, 64);
}

const SAMPLE = {
	enabled: true,
	earMode: 'AROUND', earAnchor: 'BACK',
	claws: true, horn: true,
	tailMode: 'STAR', tailSegments: 3,
	tailBend0: 45, tailBend1: -30, tailBend2: 15, tailBend3: 0,
	snoutWidth: 5, snoutHeight: 3, snoutDepth: 6, snoutOffset: 2,
	chestSize: 0.5,
	wingMode: 'ASYMMETRIC_DUAL', animateWings: false,
	capeEnabled: true, emissive: true,
};

// --- v1 round trip --------------------------------------------------------
section('v1 (Binary) codec');
{
	const img = blankSkin();
	Codec.writeFeatures(img, SAMPLE);
	eq('detects v1 magic', Codec.detectFormat(img), 'v1');

	const back = Codec.readFeatures(img);
	check('parses back', !!back);
	if (back) {
		for (const key of ['earMode', 'earAnchor', 'claws', 'horn', 'tailMode', 'tailSegments',
			'snoutWidth', 'snoutHeight', 'snoutDepth', 'snoutOffset', 'wingMode', 'animateWings',
			'capeEnabled', 'emissive']) {
			eq(`v1 ${key}`, back[key], SAMPLE[key]);
		}
		// Quantised fields: 6-bit sign-and-magnitude over +/-90 deg, 5-bit unit.
		check('v1 tailBend0 within 2deg', Math.abs(back.tailBend0 - 45) < 2, `${back.tailBend0}`);
		check('v1 tailBend1 within 2deg', Math.abs(back.tailBend1 - -30) < 2, `${back.tailBend1}`);
		check('v1 tailBend2 within 2deg', Math.abs(back.tailBend2 - 15) < 2, `${back.tailBend2}`);
		check('v1 chestSize within 0.05', Math.abs(back.chestSize - 0.5) < 0.05, `${back.chestSize}`);
	}
	const payload = Codec.encodeFeatures(SAMPLE);
	check(`v1 payload fits in 45 bytes (${payload.length})`, payload.length <= 45);
}

// --- v0 round trip --------------------------------------------------------
section('v0 (Pixelwise) codec');
{
	const img = blankSkin();
	V0.writeFeaturesV0(img, SAMPLE);
	eq('detects v0 magic', Codec.detectFormat(img), 'v0');

	const back = V0.readFeaturesV0(img);
	for (const key of ['earMode', 'earAnchor', 'claws', 'horn', 'tailMode', 'tailSegments',
		'snoutWidth', 'snoutHeight', 'snoutDepth', 'snoutOffset', 'wingMode', 'animateWings',
		'capeEnabled', 'emissive']) {
		eq(`v0 ${key}`, back[key], SAMPLE[key]);
	}
	check('v0 tailBend0 within 2deg', Math.abs(back.tailBend0 - 45) < 2, `${back.tailBend0}`);
	check('v0 tailBend1 within 2deg', Math.abs(back.tailBend1 - -30) < 2, `${back.tailBend1}`);
	check('v0 tailBend2 within 2deg', Math.abs(back.tailBend2 - 15) < 2, `${back.tailBend2}`);
	check('v0 chestSize within 0.02', Math.abs(back.chestSize - 0.5) < 0.02, `${back.chestSize}`);

	// The official Manipulator's exact pixel layout.
	const px = (x, y) => {
		const i = (y * 64 + x) * 4;
		return [img.data[i], img.data[i + 1], img.data[i + 2], img.data[i + 3]];
	};
	eq('v0 magic pixel is Magic Blue', px(0, 32).slice(0, 3), [0x3f, 0x23, 0xd8]);
	eq('v0 ear mode pixel is Magic Cyan (AROUND)', px(1, 32).slice(0, 3), [0x23, 0xd8, 0xc6]);
	eq('v0 snout pixel is w,h,d', px(2, 33).slice(0, 3), [5, 3, 6]);
	eq('v0 etc pixel is chest,offset,cape', px(3, 33).slice(0, 3), [64, 2, 16]);
}

// --- disabled -------------------------------------------------------------
section('clearing');
{
	const img = blankSkin();
	Codec.writeFeatures(img, SAMPLE);
	Codec.clearFeatures(img);
	eq('cleared skin reports no data', Codec.detectFormat(img), 'none');
}

// --- ears-common bridge ---------------------------------------------------
section('ears-common bridge');
{
	check('initCommon is present', typeof initCommon === 'function');
	check('bridge initialises', Bridge.init());
	log(`  info  ears-common version ${Bridge.commonVersion()}`, 'info');

	const img = blankSkin();
	V0.writeFeaturesV0(img, { ...SAMPLE, wingMode: 'NONE', capeEnabled: false, emissive: false });
	const { objects, alfalfa } = Bridge.buildQuads(img, { slim: false, jacket: true });

	check(`produced quads (${objects.length})`, objects.length > 0);
	const parts = new Set();
	let anchoredAll = true;
	for (const o of objects) {
		const anchor = (o.moves || []).find((m) => m.type === 'anchor');
		if (anchor) parts.add(anchor.part);
		else anchoredAll = false;
		if (o.type === 'quad' && (!o.uvs || o.uvs.length !== 4)) anchoredAll = false;
	}
	check('every object is anchored and has 4 UVs', anchoredAll);
	log(`  info  anchored to: ${[...parts].sort().join(', ')}`, 'info');
	check('anchors to the head (ears/snout/horn)', parts.has('head'));
	check('anchors to the torso (tail)', parts.has('torso'));
	check('claws anchor to legs', parts.has('left_leg') || parts.has('right_leg'));
	log(`  info  alfalfa entries: ${Object.keys(alfalfa.data).join(', ') || '(none)'}`, 'info');

	// A skin with no Ears data should render nothing.
	const blank = blankSkin();
	const none = Bridge.buildQuads(blank, {});
	eq('no magic pixels -> no quads', none.objects.length, 0);

	// window must be left clean.
	const leaked = ['rebuildQuads', 'encodeAlfalfa', 'renderObjects', 'alfalfaData',
		'magicPixels', 'magicPixelValues', 'commonVersion'].filter((k) => k in window);
	eq('no globals leaked into window', leaked, []);
}

// --- alfalfa round trip ---------------------------------------------------
section('alfalfa');
{
	// A tiny valid PNG (1x1 red) is enough to prove the encode/decode path.
	const c = document.createElement('canvas');
	c.width = 20; c.height = 16;
	const cx = c.getContext('2d');
	cx.fillStyle = '#ff0000'; cx.fillRect(0, 0, 20, 16);
	const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
	const wing = new Uint8Array(await blob.arrayBuffer());

	const img = blankSkin();
	V0.writeFeaturesV0(img, SAMPLE);
	Bridge.writeAlfalfa(img, { version: 1, data: { wing } });

	const { alfalfa, objects } = Bridge.buildQuads(img, {});
	check('wing survives the alpha-channel round trip', !!alfalfa.data.wing);
	if (alfalfa.data.wing) {
		eq('wing bytes are identical', Array.from(alfalfa.data.wing), Array.from(wing));
	}
	const wingQuads = objects.filter((o) => o.texture === 'wing');
	check(`wing geometry is rendered (${wingQuads.length} quads)`, wingQuads.length > 0);
}

// --- bedrock geometry -----------------------------------------------------
section('bedrock geometry');
{
	const build = (over, opts) => buildGeometry({ ...Codec.defaultFeatures(), enabled: true, ...over }, opts);
	const bone = (bones, name) => bones.find((b) => b.name === name);

	// Box UV only, no per-face UV: a zero-depth cube's box UV lands exactly on
	// [u, v], which is what Ears' flat quads need.
	{
		const { bones } = build({
			earMode: 'ABOVE', earAnchor: 'CENTER',
			snoutWidth: 4, snoutHeight: 2, snoutDepth: 2, snoutOffset: 1,
			tailMode: 'DOWN', tailSegments: 1,
		});
		const ears = bone(bones, 'ears').cubes[0];
		eq('ABOVE ears origin', ears.origin, [-8, 32, 0]);
		eq('ABOVE ears size', ears.size, [16, 8, 0]);
		eq('ABOVE ears uses box uv 24,0', ears.uv, [24, 0]);
		check('no per-face uv anywhere', !JSON.stringify(bones).includes('"north"'));

		const tail = bone(bones, 'tail');
		eq('tail origin', tail.cubes[0].origin, [-4, 2, 2]);
		eq('tail size', tail.cubes[0].size, [8, 12, 0]);
		eq('tail rotation is +30 (backward)', tail.rotation, [30, 0, 0]);
	}

	{
		const { bones } = build({ earMode: 'SIDES', earAnchor: 'CENTER' });
		eq('SIDES right ear origin', bone(bones, 'ear_right').cubes[0].origin, [-12, 24, 0]);
		eq('SIDES left ear origin', bone(bones, 'ear_left').cubes[0].origin, [4, 24, 0]);
		eq('SIDES left ear uv', bone(bones, 'ear_left').cubes[0].uv, [32, 0]);
	}

	{
		const { bones } = build({ earMode: 'ABOVE', earAnchor: 'BACK' });
		eq('BACK anchor pushes ears to z=4', bone(bones, 'ears').cubes[0].origin[2], 4);
	}

	// The snout can't be a box: box UV offsets every face by the depth, and the
	// strips Ears reads sit at x=0 where no positive offset can reach. It is
	// built from flat quads in rotated bones instead, as Ears draws it.
	{
		const { bones } = build({ snoutWidth: 4, snoutHeight: 2, snoutDepth: 3, snoutOffset: 1 });
		eq('snout front quad', bone(bones, 'snout').cubes[0], { origin: [-2, 25, -7], size: [4, 2, 0], uv: [0, 2] });
		eq('snout top is rotated -90 about X', bone(bones, 'snout_top').rotation, [-90, 0, 0]);
		eq('one top strip per pixel of depth', bone(bones, 'snout_top').cubes.length, 3);
		eq('first top strip uses uv 0,1', bone(bones, 'snout_top').cubes[0].uv, [0, 1]);
		eq('later top strips repeat uv 0,0', bone(bones, 'snout_top').cubes[1].uv, [0, 0]);
		eq('first bottom strip sits below the front', bone(bones, 'snout_bottom').cubes[0].uv, [0, 4]);
		eq('sides are rotated 90 about Y', bone(bones, 'snout_right').rotation, [0, 90, 0]);
		eq('side strips are 1 wide', bone(bones, 'snout_right').cubes[0].size, [1, 2, 0]);
		eq('first side strip uses uv 7,0', bone(bones, 'snout_right').cubes[0].uv, [7, 0]);

		// Those strips are authored as flat XY quads and only become horizontal
		// once the bone rotation is applied, so check where they actually land
		// rather than trusting the authored coordinates.
		const rotX = (deg, pivot, p) => {
			const t = (deg * Math.PI) / 180, c = Math.cos(t), s = Math.sin(t);
			const dy = p[1] - pivot[1], dz = p[2] - pivot[2];
			return [p[0], pivot[1] + dy * c - dz * s, pivot[2] + dy * s + dz * c];
		};
		const top = bone(bones, 'snout_top');
		const y1 = 24 + 1 + 2; // head bottom + offset + height
		for (let k = 0; k < 3; k++) {
			const cube = top.cubes[k];
			const lo = rotX(-90, top.pivot, cube.origin);
			const hi = rotX(-90, top.pivot, [cube.origin[0], cube.origin[1] + 1, cube.origin[2]]);
			const zs = [lo[2], hi[2]].sort((a, b) => a - b).map((n) => +n.toFixed(6));
			check(`top strip ${k} lies flat on the snout roof`, Math.abs(lo[1] - y1) < 1e-6 && Math.abs(hi[1] - y1) < 1e-6,
				`y ${lo[1]}, ${hi[1]}`);
			eq(`top strip ${k} covers its 1px of depth`, zs, [-4 - k - 1, -4 - k]);
		}
	}

	{
		const { bones } = build({ tailMode: 'UP', tailSegments: 3, tailBend0: 0, tailBend1: 10, tailBend2: -10 });
		const segs = bones.filter((b) => /^tail(_\d+)?$/.test(b.name));
		eq('3 tail segments become 3 bones', segs.length, 3);
		eq('segment height is 12/3', segs[0].cubes[0].size[1], 4);
		eq('segment pivots step down', segs.map((s) => s.pivot[1]), [14, 10, 6]);
		eq('UP base angle applies to segment 0', segs[0].rotation[0], 130);
		eq('later segments carry their own bend', segs[1].rotation[0], 10);
		eq('segments chain as parents', segs[1].parent, 'tail');
	}

	// Cross/star blades are their own bones so each carries its own rotation.
	{
		const { bones } = build({ tailMode: 'CROSS', tailSegments: 2, tailBend0: -44, tailBend1: 18 });
		const blade = bone(bones, 'tail_blade1');
		check('CROSS adds a blade bone', !!blade);
		eq('blade is rotated 90 about Y', blade.rotation, [0, 90, 0]);
		eq('blade is parented to its segment', blade.parent, 'tail');
		eq('blade pivots on the centre line', blade.pivot[0], 0);
		check('bent CROSS uses a 90deg base', Math.abs(bone(bones, 'tail').rotation[0] - (90 - 44)) < 0.001);
		check('the second segment gets its own blade', !!bone(bones, 'tail_1_blade1'));

		const flat = build({ tailMode: 'CROSS', tailSegments: 1, tailBend0: 0 }).bones;
		eq('unbent CROSS uses an 80deg base', bone(flat, 'tail').rotation[0], 80);

		const star = build({ tailMode: 'STAR', tailSegments: 1 }).bones;
		eq('STAR fans three blades', star.filter((b) => /_blade\d$/.test(b.name)).map((b) => b.rotation[1]), [45, 90, 135]);

		const overlap = build({ tailMode: 'CROSS_OVERLAP', tailSegments: 2 }).bones;
		eq('overlap leaves segment 0 alone', bone(overlap, 'tail').cubes[0].size[1], 6);
		eq('overlap extends later segments by 4', bone(overlap, 'tail_1').cubes[0].size[1], 10);
	}

	{
		const wide = build({}).bones;
		const slim = build({}, { slim: true }).bones;
		eq('wide arm is 4 wide at x -8', [bone(wide, 'rightArm').cubes[0].origin[0], bone(wide, 'rightArm').cubes[0].size[0]], [-8, 4]);
		eq('slim arm is 3 wide at x -7', [bone(slim, 'rightArm').cubes[0].origin[0], bone(slim, 'rightArm').cubes[0].size[0]], [-7, 3]);
		eq('slim left arm is 3 wide at x 4', [bone(slim, 'leftArm').cubes[0].origin[0], bone(slim, 'leftArm').cubes[0].size[0]], [4, 3]);
		check('slim still gets its Ears bones', build({ earMode: 'ABOVE' }, { slim: true }).bones.some((b) => b.name === 'ears'));

		// Copied from the game's own vanilla pack, quirks included: slim arms
		// hang half a pixel lower, and the two models disagree on the cape's Z.
		eq('slim arm hangs 0.5 lower', bone(slim, 'rightArm').cubes[0].origin[1], 11.5);
		eq('slim arm pivot follows it down', bone(slim, 'rightArm').pivot[1], 21.5);
		eq('wide arm sits at 12', bone(wide, 'rightArm').cubes[0].origin[1], 12);
		eq('wide cape pivot is +3', bone(wide, 'cape').pivot[2], 3);
		eq('slim cape pivot is -3', bone(slim, 'cape').pivot[2], -3);
		for (const name of ['jacket', 'leftSleeve', 'rightSleeve', 'leftPants', 'rightPants', 'leftItem', 'rightItem']) {
			check(`vanilla bone ${name} is present`, !!bone(wide, name));
		}
		check('the overlay layers are separate bones, not extra body cubes',
			bone(wide, 'body').cubes.length === 1 && bone(wide, 'jacket').cubes[0].inflate === 0.25);
	}

	{
		const { unsupported } = build({
			earMode: 'TALL', tailMode: 'VERTICAL', claws: true, horn: true, wingMode: 'SYMMETRIC_DUAL',
		});
		check('reports TALL ears as unsupported', unsupported.some((u) => /TALL/.test(u)));
		check('reports VERTICAL tail as unsupported', unsupported.some((u) => /VERTICAL/.test(u)));
		check('reports wings as unsupported', unsupported.includes('wings'));
		log(`  info  unsupported: ${unsupported.join(', ')}`, 'info');
	}

	{
		const { bones } = buildGeometry({ ...Codec.defaultFeatures(), enabled: false });
		check('a plain skin gets no Ears bones', !bones.some((b) => /ears|snout|tail/.test(b.name)));
		check('a plain skin still has a full player model', bones.length >= 17);
	}
}

// --- skin pack ------------------------------------------------------------
section('skin pack');
{
	const skinPng = async (features) => {
		const img = blankSkin();
		if (features) V0.writeFeaturesV0(img, features);
		const c = document.createElement('canvas');
		c.width = 64; c.height = 64;
		c.getContext('2d').putImageData(img, 0, 0);
		return c.toDataURL('image/png');
	};

	const foxy = await skinPng({ ...Codec.defaultFeatures(), enabled: true, earMode: 'ABOVE', earAnchor: 'CENTER', tailMode: 'DOWN', tailSegments: 1, snoutWidth: 3, snoutHeight: 2, snoutDepth: 3, snoutOffset: 1 });
	const plain = await skinPng(null);

	const a = await SkinPack.inspectSkin({ name: 'Foxy.png', content: foxy });
	const b = await SkinPack.inspectSkin({ name: 'plain skin.png', content: plain });
	eq('reads Ears data out of a packed skin', [a.version, a.features.earMode, a.features.tailMode], ['v0', 'ABOVE', 'DOWN']);
	eq('a plain skin reports no data', b.version, 'none');
	log(`  info  summary: ${SkinPack.summarise(a)}`, 'info');

	const tooSmall = await SkinPack.inspectSkin({ name: 'small.png', content: (() => {
		const c = document.createElement('canvas'); c.width = 32; c.height = 32; return c.toDataURL('image/png');
	})() });
	check('rejects a non-64x64 skin', !!tooSmall.error, tooSmall.error);

	check('JSZip is available', typeof JSZip === 'function');
	if (typeof JSZip === 'function') {
		const { blob, count, slug } = await SkinPack.buildPack([a, b], { packName: 'My Ears Pack', slim: true });
		eq('packaged both skins', count, 2);
		eq('pack name is slugified for identifiers', slug, 'My_Ears_Pack');
		check(`produced a zip (${blob.size} bytes)`, blob.size > 0);

		const zip = await JSZip.loadAsync(blob);
		const names = Object.keys(zip.files).sort();
		for (const required of ['manifest.json', 'skins.json', 'geometry.json', 'texts/en_US.lang']) {
			check(`pack contains ${required}`, names.includes(required));
		}
		check('pack contains one png per skin', names.filter((n) => n.endsWith('.png')).length === 2, names.join(', '));

		const manifest = JSON.parse(await zip.file('manifest.json').async('string'));
		eq('manifest declares a skin_pack module', manifest.modules[0].type, 'skin_pack');
		eq('manifest is format 2, like the vanilla pack', manifest.format_version, 2);
		eq('header.name is the literal pack name, not a lang key', manifest.header.name, 'My Ears Pack');
		check('manifest uuids differ', manifest.header.uuid !== manifest.modules[0].uuid);

		const skins = JSON.parse(await zip.file('skins.json').async('string'));
		const geo = JSON.parse(await zip.file('geometry.json').async('string'));

		// The format that actually matters, checked against the game's own
		// `vanilla` skin pack: 1.12.0, entries in a minecraft:geometry array.
		eq('geometry.json is the 1.12.0 format', geo.format_version, '1.12.0');
		const entries = geo['minecraft:geometry'];
		check('geometries live in a minecraft:geometry array', Array.isArray(entries));
		const byId = Object.fromEntries(entries.map((e) => [e.description.identifier, e]));
		const geoIds = Object.keys(byId);
		eq('one geometry per skin', geoIds.length, 2);
		check('identifiers have a single dotted segment',
			geoIds.every((id) => id.split('.').length === 2), geoIds.join(', '));
		check('every geometry declares its texture size',
			entries.every((e) => e.description.texture_width === 64 && e.description.texture_height === 64));

		eq('skins.json lists both', skins.skins.length, 2);
		check('every skin points at a geometry that exists',
			skins.skins.every((s) => geoIds.includes(s.geometry)), `${geoIds.join(', ')}`);
		check('every skin points at a texture that exists',
			skins.skins.every((s) => names.includes(s.texture)));

		const lang = await zip.file('texts/en_US.lang').async('string');
		check('lang names every skin', skins.skins.every((s) => lang.includes(`skin.${slug}.${s.localization_name}=`)), lang);

		const withEars = byId[geoIds.find((id) => id.endsWith('Foxy'))];
		const without = byId[geoIds.find((id) => id.endsWith('plain_skin'))];
		check('the Ears skin got ear/tail/snout bones',
			withEars.bones.some((x) => x.name === 'ears') && withEars.bones.some((x) => x.name === 'tail') && withEars.bones.some((x) => x.name === 'snout'));
		check('the plain skin got none', !without.bones.some((x) => /ears|snout|tail/.test(x.name)));
		// The pack was built slim, so both models must carry slim arms.
		check('slim carried through to the packaged geometry',
			[withEars, without].every((g) => g.bones.find((x) => x.name === 'rightArm').cubes[0].size[0] === 3));
	}
}

section('result');
log(`${passed} passed, ${failed} failed`, failed ? 'fail' : 'pass');
window.__results = { passed, failed };
</script>
</body>
</html>
